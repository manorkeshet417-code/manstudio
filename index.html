<!doctype html>
<html lang="en" data-theme="neon">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Man Studio</title>
<meta name="description" content="Man Studio: indie games, apps and live events. Color Under Pressure, DOBE's Workshop, THE ZONE and more.">
<meta property="og:title" content="Man Studio">
<meta property="og:description" content="Rush into the Future. Games, apps and events by Man Studio.">
<meta property="og:image" content="https://img.itch.zone/aW1nLzMxNTIzODMwLmpwZw==/original/wvNlrm.jpg">
<meta name="theme-color" content="#0a0a14">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0a14'/%3E%3Ctext x='32' y='46' font-family='Arial Black,Arial' font-weight='900' font-size='40' text-anchor='middle' fill='%2328a0ff'%3EM%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a14; --bg2:#12121f; --card:#171729; --line:rgba(255,255,255,.09); --fg:#f4f4ff; --mut:#a3a3c2;
  --a1:#ff2d4b; --a2:#2891ff; --a3:#28e15f; --a4:#ffd723; --a5:#af32ff; --acc:var(--a2);
  --glow:0 0 24px color-mix(in srgb,var(--acc) 55%,transparent);
  --r:18px; --font:'Rubik',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  color-scheme:dark;
}
/* themes */
[data-theme=halloween]{--bg:#0e0710;--bg2:#1a0c16;--card:#1f1019;--acc:#ff8a1f;--a1:#ff6a00;--a2:#ff8a1f;--a3:#9cff3a;--a4:#ffcc33;--a5:#a33cff}
[data-theme=winter]{--bg:#06101c;--bg2:#0b1828;--card:#0f2033;--acc:#7fd4ff;--a1:#bfe9ff;--a2:#7fd4ff;--a3:#8affe0;--a4:#ffffff;--a5:#9db6ff}
[data-theme=summer]{--bg:#081419;--bg2:#0e1f26;--card:#11262e;--acc:#ffb12e;--a1:#ff5e5b;--a2:#2ec4ff;--a3:#2effa8;--a4:#ffd23e;--a5:#ff8fd8}
[data-theme=zone]{--bg:#07040f;--bg2:#120a22;--card:#170d2a;--acc:#ff3fd2;--a1:#ff3fd2;--a2:#3ff0ff;--a3:#8a5bff;--a4:#ffe55a;--a5:#ff3fd2}
[data-theme=glitch]{--bg:#030a05;--bg2:#08140b;--card:#0b1a0f;--acc:#39ff6a;--a1:#ff2bd6;--a2:#39ff6a;--a3:#39ff6a;--a4:#e8ff3a;--a5:#ff2bd6}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);-webkit-font-smoothing:antialiased}
body{min-height:100vh;overflow-x:hidden}
body.noscroll{overflow:hidden}
a{color:var(--acc)}
img{max-width:100%}
/* background: soft color blobs that drift, per theme */
.bgfx{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bgfx i{position:absolute;width:46vmax;height:46vmax;border-radius:50%;filter:blur(90px);opacity:.22;animation:drift 26s ease-in-out infinite alternate}
.bgfx i:nth-child(1){background:var(--a1);left:-12vmax;top:-14vmax}
.bgfx i:nth-child(2){background:var(--a2);right:-14vmax;top:10vh;animation-delay:-8s}
.bgfx i:nth-child(3){background:var(--a5);left:20vw;bottom:-22vmax;animation-delay:-16s}
.bgfx::after{content:'';position:absolute;inset:0;background:linear-gradient(transparent 0 60%,var(--bg)),repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 80px),repeating-linear-gradient(0deg,var(--line) 0 1px,transparent 1px 80px);mask-image:linear-gradient(to bottom,transparent,#000 40%,transparent);opacity:.35}
@keyframes drift{to{transform:translate(6vmax,4vmax) scale(1.12)}}
[data-theme=glitch] .bgfx::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(57,255,106,.05) 0 2px,transparent 2px 4px);animation:scan 6s linear infinite}
@keyframes scan{to{transform:translateY(40px)}}
@media (prefers-reduced-motion:reduce){.bgfx i,.bgfx::before{animation:none}}
/* header */
#top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:18px;padding:12px max(16px,calc(50vw - 600px));background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;color:var(--fg);text-decoration:none;font-weight:900;letter-spacing:.08em;white-space:nowrap}
.logo-m{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--a1),var(--a5) 50%,var(--a2));font-size:20px;box-shadow:var(--glow)}
#nav{display:flex;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none}
#nav::-webkit-scrollbar{display:none}
#nav a{color:var(--mut);text-decoration:none;padding:8px 12px;border-radius:10px;font-weight:500;white-space:nowrap}
#nav a:hover{color:var(--fg);background:var(--line)}
#nav a.on{color:var(--fg);background:color-mix(in srgb,var(--acc) 22%,transparent)}
.top-r{display:flex;align-items:center;gap:8px;margin-inline-start:auto}
.lang{background:var(--line);color:var(--fg);border:0;border-radius:10px;padding:8px 10px;font:inherit;font-weight:700;cursor:pointer}
.burger{display:none;background:none;border:0;color:var(--fg);font-size:24px;cursor:pointer;padding:4px 8px}
@media (max-width:820px){
  .burger{display:block}
  #nav{position:fixed;top:62px;inset-inline:0;flex-direction:column;background:var(--bg2);padding:10px 16px 16px;border-bottom:1px solid var(--line);display:none}
  body.menu-open #nav{display:flex}
  #nav a{padding:12px}
}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;border-radius:14px;border:0;font:inherit;font-weight:700;text-decoration:none;cursor:pointer;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px)}
.btn:disabled{opacity:.5;pointer-events:none}
.btn.pri{background:var(--acc);color:#060610;box-shadow:var(--glow)}
.btn.ghost{background:var(--line);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}
.btn.sm{padding:8px 14px;border-radius:11px;font-size:14px}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.btns.center{justify-content:center;margin:0}
.linkbtn{background:none;border:0;color:var(--acc);font:inherit;cursor:pointer;text-decoration:underline}
/* page */
main{max-width:1200px;margin:0 auto;padding:0 16px 40px}
.blk{margin:46px 0}
.blk h2{font-size:clamp(22px,3vw,30px);margin:0 0 18px;font-weight:900;letter-spacing:.01em}
.center{text-align:center}
.muted{color:var(--mut)}
.loading{color:var(--mut);padding:20px 0}
.hero{position:relative;margin:22px 0 10px;border-radius:28px;overflow:hidden;min-height:340px;display:grid;align-items:end;border:1px solid var(--line);background:var(--bg2)}
.hero-bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.55;transform:scale(1.03)}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,var(--bg) 4%,color-mix(in srgb,var(--bg) 40%,transparent) 55%,transparent)}
.hero-in{position:relative;z-index:1;padding:clamp(22px,5vw,56px)}
.hero-ic{font-size:64px}
.hero h1{margin:0;font-size:clamp(34px,7vw,76px);line-height:1;font-weight:900;letter-spacing:.02em}
.glow{text-shadow:0 0 22px color-mix(in srgb,var(--acc) 70%,transparent),0 0 2px #fff}
.lead{font-size:clamp(16px,2vw,20px);color:color-mix(in srgb,var(--fg) 82%,transparent);max-width:60ch;margin:14px 0 0}
.txt .md{max-width:75ch;font-size:17px;line-height:1.7;color:color-mix(in srgb,var(--fg) 88%,transparent)}
.md p{margin:0 0 12px}
.pic{margin:0;border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.pic img{display:block;width:100%}
.pic figcaption{padding:10px 14px;color:var(--mut);font-size:14px}
.wide{margin-inline:-16px}
/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{display:flex;flex-direction:column;background:var(--card);border-radius:var(--r);overflow:hidden;text-decoration:none;color:var(--fg);border:1px solid var(--line);transition:transform .2s,box-shadow .2s,border-color .2s}
.card:hover{transform:translateY(-4px);border-color:color-mix(in srgb,var(--acc) 60%,transparent);box-shadow:0 12px 40px -10px color-mix(in srgb,var(--acc) 50%,transparent)}
.card.soon{opacity:.6}
.card-img{position:relative;aspect-ratio:16/10;background:var(--bg2);display:grid;place-items:center;overflow:hidden}
.card-img img{width:100%;height:100%;object-fit:cover}
.card-ic{font-size:64px}
.badge{position:absolute;top:10px;inset-inline-start:10px;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(6px);color:var(--acc);font-size:11px;font-weight:900;letter-spacing:.1em;padding:5px 9px;border-radius:8px;border:1px solid color-mix(in srgb,var(--acc) 50%,transparent)}
.card-b{padding:14px 16px 18px;display:grid;gap:6px}
.card-b b{font-size:18px}
.card-b span{color:var(--mut);font-size:14px;line-height:1.45}
/* countdown */
.count{background:linear-gradient(135deg,color-mix(in srgb,var(--a5) 22%,var(--card)),color-mix(in srgb,var(--a2) 18%,var(--card)));border:1px solid var(--line);border-radius:24px;padding:26px;text-align:center}
.cd{display:flex;justify-content:center;gap:clamp(8px,3vw,28px);margin:6px 0 10px}
.cd span{display:grid;gap:2px;min-width:64px;color:var(--mut);font-size:13px}
.cd b{font-size:clamp(30px,6vw,52px);color:var(--fg);font-variant-numeric:tabular-nums;text-shadow:0 0 16px color-mix(in srgb,var(--acc) 60%,transparent)}
.count.live .cd{opacity:.4}
.cd-when{color:var(--acc);font-weight:700}
/* news */
.news{display:grid;gap:16px}
.post{display:grid;grid-template-columns:200px 1fr;gap:18px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.post:not(:has(img)){grid-template-columns:1fr}
.post img{width:100%;height:100%;object-fit:cover;min-height:140px}
.post>div{padding:16px 18px 16px 0}
.post:not(:has(img))>div{padding:16px 18px}
[dir=rtl] .post>div{padding:16px 0 16px 18px}
.post time{color:var(--acc);font-size:13px;font-weight:700}
.post h3{margin:4px 0 8px;font-size:20px}
.post .md{color:color-mix(in srgb,var(--fg) 85%,transparent);line-height:1.6}
.more{font-weight:700;text-decoration:none}
@media (max-width:640px){.post{grid-template-columns:1fr}.post>div,[dir=rtl] .post>div{padding:0 16px 16px}.post img{max-height:200px}}
/* leaderboard */
.lb{list-style:none;margin:0;padding:0;display:grid;gap:6px;max-width:760px}
.lb li{display:grid;grid-template-columns:44px 1fr auto auto;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.lb li.me{border-color:var(--acc);box-shadow:var(--glow)}
.rk{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--line);font-weight:900}
.rk.r1{background:#ffd723;color:#201800}.rk.r2{background:#d6dae6;color:#15171c}.rk.r3{background:#e0904f;color:#1d0f04}
.nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rp{color:var(--acc);font-weight:900}
.sc{color:var(--mut);font-size:13px;min-width:60px;text-align:end}
/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;max-width:640px;margin:18px auto}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:4px}
.stats b{font-size:28px;color:var(--acc)}
.stats span{color:var(--mut);font-size:13px}
.member{display:grid;gap:8px;justify-items:center;margin:20px auto;max-width:420px;padding:18px;border-radius:18px;border:1px dashed var(--acc);background:color-mix(in srgb,var(--acc) 10%,transparent)}
.member code{font-size:26px;font-weight:900;letter-spacing:.12em;color:var(--fg)}
.vid{position:relative;aspect-ratio:16/9;border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.htmlbox{width:100%;border:0;border-radius:var(--r);background:transparent}
/* footer */
#foot{border-top:1px solid var(--line);padding:30px 16px 90px;text-align:center;color:var(--mut)}
.soc{display:flex;flex-wrap:wrap;justify-content:center;gap:18px;margin-bottom:10px}
.soc a{color:var(--fg);text-decoration:none;font-weight:500}
/* modal & forms */
#modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px}
#modal[hidden]{display:none}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px)}
.box{position:relative;background:var(--bg2);border:1px solid var(--line);border-radius:22px;padding:22px;width:min(640px,100%);max-height:88vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.box h2{margin:0 0 6px}
.box label{display:grid;gap:6px;margin:12px 0;font-weight:500;font-size:14px;color:var(--mut)}
input,textarea,select{width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:11px;padding:11px 12px;font:inherit}
input:focus,textarea:focus,select:focus{outline:2px solid var(--acc);outline-offset:1px}
.row{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;flex-wrap:wrap}
.err{color:#ff6b7a;min-height:1.2em;margin:4px 0 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,40px);opacity:0;background:var(--card);border:1px solid var(--acc);padding:12px 18px;border-radius:14px;z-index:60;transition:.25s;pointer-events:none;font-weight:500}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{border-color:#ff4d5e}
html.admin .toast{bottom:84px}
/* admin */
#adminbar{position:fixed;inset-inline:0;bottom:0;z-index:40;display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:10px 14px;background:color-mix(in srgb,#05050c 92%,transparent);backdrop-filter:blur(12px);border-top:2px solid var(--acc)}
#adminbar button{background:var(--line);color:var(--fg);border:0;border-radius:10px;padding:9px 12px;font:inherit;font-size:14px;font-weight:500;cursor:pointer}
#adminbar button.on{background:var(--acc);color:#05050c}
#adminbar .pub{background:var(--a3);color:#04140a;font-weight:900}
#adminbar .ghost{background:none;box-shadow:inset 0 0 0 1px var(--line)}
.ab-t{color:var(--acc);letter-spacing:.15em;font-size:12px}
.ab-s{flex:1;min-width:120px;color:var(--mut);font-size:13px;text-align:center}
html.editing .b{position:relative;outline:2px dashed color-mix(in srgb,var(--acc) 45%,transparent);outline-offset:4px;border-radius:20px;margin:26px 0 8px}
.etb{position:sticky;top:64px;z-index:10;display:flex;flex-wrap:wrap;gap:4px;align-items:center;background:var(--acc);color:#05050c;border-radius:12px;padding:5px;margin-bottom:-4px;width:max-content;max-width:100%}
.etb span{font-weight:900;font-size:12px;padding:0 8px}
.etb button{background:rgba(0,0,0,.18);color:#05050c;border:0;border-radius:8px;padding:6px 9px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.eadd{text-align:center;margin:26px 0}
.eadd button{background:none;border:2px dashed var(--acc);color:var(--acc);border-radius:14px;padding:14px 22px;font:inherit;font-weight:700;cursor:pointer}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;margin-top:14px}
.pick button{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:14px;font:inherit;cursor:pointer;text-align:start}
.pick button:hover{border-color:var(--acc)}
.ef .fld{margin:14px 0}
.ef .fld>label{margin:0 0 6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:560px){.two{grid-template-columns:1fr}}
.chk{display:flex!important;align-items:center;gap:8px;grid-template-columns:none}
.chk input{width:auto}
fieldset{border:1px solid var(--line);border-radius:14px;margin:8px 0;padding:10px}
.lt{display:flex;gap:6px;align-items:center}
.lt b{flex:1;color:var(--acc)}
.lt button,.prow button{background:var(--line);color:var(--fg);border:0;border-radius:8px;padding:6px 9px;cursor:pointer;font:inherit;font-size:13px}
.imgf{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}
.imgf img{width:64px;height:44px;object-fit:cover;border-radius:8px}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:13px}
.plist{display:grid;gap:6px;margin:14px 0}
.prow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.pt{flex:1;display:grid;min-width:140px}
.pt code{color:var(--mut);font-size:12px}
</style>
</head>
<body>
<div class="bgfx" aria-hidden="true"><i></i><i></i><i></i></div>
<header id="top"></header>
<main id="main"><div class="loading" style="padding:80px 0;text-align:center">Loading…</div></main>
<footer id="foot"></footer>
<div id="modal" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script type="module" src="js/site.js"></script>
</body>
</html>
